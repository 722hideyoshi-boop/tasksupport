<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ登録 | TaskSupport</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="page-container">

        <header th:replace="~{fragments/header :: header('問い合わせ登録')}"></header>

        <form class="card form-card" th:action="@{/tickets}" th:object="${ticketRegisterForm}" method="post">

            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" id="title" th:field="*{title}">
                <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                    タイトルの入力エラー
                </p>
            </div>

            <div class="form-group">
                <label for="priority">優先度</label>
                <select id="priority" th:field="*{priority}">
                    <option value="低">低</option>
                    <option value="中">中</option>
                    <option value="高">高</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">登録</button>
                <a class="btn btn-secondary" th:href="@{/tickets}">キャンセル</a>
            </div>

        </form>

    </div>

</body>

</html>

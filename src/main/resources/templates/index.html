<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>問い合わせ一覧</title>
</head>

<body>
    <h1>問い合わせ一覧</h1>

    <div>
        <p>
            ログイン中：
            <span sec:authentication="name">ユーザー名</span>
        </p>

        <p sec:authorize="hasRole('ADMIN')">
            権限：ADMIN
        </p>

        <p sec:authorize="hasRole('USER')">
            権限：USER
        </p>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit">ログアウト</button>
    </form>

    <form th:action="@{/tickets}" method="get">
        <label for="title">タイトル:</label>
        <input type="text" id="title" name="title" th:value="${title}">

        <label for="status">ステータス:</label>
        <select name="status">
            <option value="" th:selected="${selectedStatus == null or selectedStatus == ''}">すべて</option>
            <option value="未対応" th:selected="${selectedStatus == '未対応'}">未対応</option>
            <option value="対応中" th:selected="${selectedStatus == '対応中'}">対応中</option>
            <option value="完了" th:selected="${selectedStatus == '完了'}">完了</option>
        </select>
        <button type="submit">検索</button>


    </form>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>優先度</th>
                <th>ステータス</th>
                <th>登録日時</th>
                <th>最終更新日時</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}">ID</td>
                <td th:text="${ticket.title}">タイトル</td>
                <td th:text="${ticket.priority}">優先度</td>
                <td th:text="${ticket.status}">ステータス</td>
                <td th:text="${#temporals.format(ticket.registrationDate, 'yyyy-MM-dd HH:mm')}">
                    登録日時
                </td>
                <td th:text="${#temporals.format(ticket.updatedDate, 'yyyy-MM-dd HH:mm')}">
                    最終更新日時
                </td>
                <td>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/tickets/{id}/edit(id=${ticket.id})}">編集</a>

                    <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}" method="post"
                        sec:authorize="hasRole('ADMIN')">

                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div>

        <a th:if="${!tickets.first}" th:href="@{/tickets(
           page=${tickets.number - 1},
           title=${title},
           status=${selectedStatus}
       )}">
            前へ
        </a>

        <span th:each="pageNumber : ${#numbers.sequence(
            tickets.number > 2 ? tickets.number - 2 : 0,
            tickets.number + 2 < tickets.totalPages ? tickets.number + 2 : tickets.totalPages - 1
        )}">

            <span th:if="${pageNumber == tickets.number}" th:text="${pageNumber + 1}">
                1
            </span>

            <a th:if="${pageNumber != tickets.number}" th:href="@{/tickets(
               page=${pageNumber},
               title=${title},
               status=${selectedStatus}
           )}" th:text="${pageNumber + 1}">
                1
            </a>

        </span>

        <a th:if="${!tickets.last}" th:href="@{/tickets(
           page=${tickets.number + 1},
           title=${title},
           status=${selectedStatus}
       )}">
            次へ
        </a>

    </div>
</body>

</html>

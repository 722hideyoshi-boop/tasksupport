<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アクセス権限エラー | TaskSupport</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="error-page">

        <div class="card error-card">

            <p class="error-card__code">403</p>
            <p class="error-card__title">アクセスできません</p>
            <p class="error-card__message">この操作を行う権限がありません。</p>

            <a class="btn btn-primary" th:href="@{/tickets}">
                問い合わせ一覧へ戻る
            </a>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ詳細 | TaskSupport</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="page-container">

        <header th:replace="~{fragments/header :: header('問い合わせ詳細')}"></header>

        <div class="card detail-card">

            <dl>

                <dt>ID</dt>
                <dd th:text="${ticket.id}"></dd>

                <dt>タイトル</dt>
                <dd th:text="${ticket.title}"></dd>

                <dt>優先度</dt>
                <dd th:switch="${ticket.priority}">
                    <span th:case="'高'" class="badge badge-priority-high">高</span>
                    <span th:case="'中'" class="badge badge-priority-medium">中</span>
                    <span th:case="'低'" class="badge badge-priority-low">低</span>
                    <span th:case="*" th:text="${ticket.priority}">優先度</span>
                </dd>

                <dt>ステータス</dt>
                <dd th:switch="${ticket.status}">
                    <span th:case="'未対応'" class="badge badge-status-todo">未対応</span>
                    <span th:case="'対応中'" class="badge badge-status-progress">対応中</span>
                    <span th:case="'完了'" class="badge badge-status-done">完了</span>
                    <span th:case="*" th:text="${ticket.status}">ステータス</span>
                </dd>

                <dt>登録日時</dt>
                <dd th:text="${#temporals.format(ticket.registrationDate, 'yyyy-MM-dd HH:mm:ss')}"></dd>

                <dt>最終更新日時</dt>
                <dd th:text="${#temporals.format(ticket.updatedDate, 'yyyy-MM-dd HH:mm:ss')}"></dd>

            </dl>

            <div class="detail-card__footer">
                <a class="btn btn-secondary" th:href="@{/tickets(
                    page=${page},
                    title=${title},
                    status=${status},
                    sort=${sort}
                )}">
                    ← 一覧へ戻る
                </a>

                <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/tickets/{id}/edit(id=${ticket.id})}">
                    編集する
                </a>
            </div>

        </div>

    </div>

</body>

</html>

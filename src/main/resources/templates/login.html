<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>

<body>

    <h1>TaskSupport ログイン</h1>

    <form th:action="@{/login}" method="post">

        <p>ユーザー名</p>
        <input type="text" name="username">

        <p>パスワード</p>
        <input type="password" name="password">

        <button type="submit">ログイン</button>

    </form>

</body>

</html>

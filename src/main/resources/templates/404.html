<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせが見つかりません | TaskSupport</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="error-page">

        <div class="card error-card">

            <p class="error-card__code">404</p>
            <p class="error-card__title">問い合わせが見つかりません</p>
            <p class="error-card__message" th:text="${message}">
                指定された問い合わせは存在しないか、削除された可能性があります。
            </p>

            <a class="btn btn-primary" th:href="@{/tickets}">
                問い合わせ一覧へ戻る
            </a>

        </div>

    </div>

</body>

</html>
